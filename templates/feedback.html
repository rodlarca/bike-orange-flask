<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bike Orange - Evaluación</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <nav class="navbar navbar-expand navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">Bike Orange</a>
      <div class="navbar-nav ms-auto">
        <a class="nav-link" href="ruta.html">Volver</a>
      </div>
    </div>
  </nav>

  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-lg-7">
        <div class="card shadow-sm">
          <div class="card-body p-4">
            <div class="d-flex align-items-center justify-content-between">
              <h1 class="h4 fw-bold mb-0">Evaluación de experiencia</h1>
              <span class="badge text-bg-warning text-dark">Paso 3</span>
            </div>

            <p class="text-muted mt-2">
              Tu feedback mejora el servicio para futuros turistas y ciudadanos.
            </p>

            <form>
              <div class="mb-3">
                <label class="form-label fw-bold">Calificación</label>
                <select class="form-select">
                  <option>★★★★★ Excelente</option>
                  <option>★★★★☆ Muy buena</option>
                  <option>★★★☆☆ Buena</option>
                  <option>★★☆☆☆ Regular</option>
                  <option>★☆☆☆☆ Mala</option>
                </select>
              </div>

              <div class="mb-3">
                <label class="form-label fw-bold">Comentario</label>
                <textarea class="form-control" rows="3" placeholder="¿Qué fue lo mejor y qué mejorarías?"></textarea>
              </div>

              <div class="d-flex gap-2">
                <a class="btn btn-warning fw-bold" href="index.html">Enviar (simulado) y volver al inicio</a>
                <a class="btn btn-outline-dark fw-bold" href="experiencias.html">Ver más rutas</a>
              </div>
            </form>

            <hr class="my-4">
            <p class="small text-muted mb-0">
              En una implementación real, esto se guardaría en base de datos y se usaría para mejorar rutas.
            </p>
          </div>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
